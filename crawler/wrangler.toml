name = "alphy-titles"
main = "src/index.js"
compatibility_date = "2026-06-14"
workers_dev = true

# One invocation every two minutes. Each does a small, paced batch and exits, so
# a killed or overlapping run loses at most that batch — the cursor is in D1.
#
# This block is declared rather than commented out because it is ON. Commenting
# it out does NOT remove the schedule from Cloudflare — wrangler only writes the
# triggers a config declares and leaves an existing schedule alone — so the
# "stopped" crawl of 2026-08-28 in fact kept firing every two minutes for eleven
# days while the file said otherwise. To actually stop it, delete the schedule on
# the account:
#   wrangler triggers deploy   (with an empty crons list), or the dashboard.
[triggers]
crons = ["*/2 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "alphy-titles"
database_id = "59ae35a1-d8b0-48d7-b258-52317f18e58a"

[vars]
# Pacing. Deliberately gentle: ~25 requests a minute is less than one person
# browsing the site, and the whole point is to be unnoticeable rather than fast.
# Eight, not 25: a tick must finish inside the free plan's 10 ms of CPU, or it
# is killed with its fills unpublished.
BATCH = "8"
SPACING_MS = "2000"
