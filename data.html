<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>данные</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #000; --surface: #0c0c0c; --raised: #151515; --line: #232323;
    --ink: #f0efec; --ink-2: #b4b3ab; --ink-3: #7b7a73;
    --accent: #ff0;
    --l: #3987e5; --f: #d95926; --t: #199e70; --s: #8a8a84;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 15px/1.4 Inter, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 22px 24px 40px; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  h1 a { color: var(--accent); }
  .fresh { color: var(--ink-3); font-size: 13px; }
  .load { flex: 1 1 200px; display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 13px; justify-content: flex-end; }
  .load i { display: block; width: 160px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .load b { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .load.done { display: none; }

  .tiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 14px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
  .tile span { display: block; color: var(--ink-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile b { display: block; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; margin-top: 2px; }
  .tile small { color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }

  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0; }
  .search { flex: 1 1 320px; position: relative; }
  .search input { width: 100%; height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); outline: 0; }
  .search input:focus { border-color: var(--accent); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { height: 38px; padding: 0 12px; background: var(--surface); border: 0; color: var(--ink-2); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--raised); color: var(--ink); }
  .btn { height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer; }
  .btn:hover, .seg button:hover { color: var(--ink); }
  .btn.four.on { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .grid { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: 12px; margin-bottom: 14px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
  .panel h2 { margin: 0 0 2px; font-size: 14px; font-weight: 600; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 2px; }
  .seg.small button { height: 26px; padding: 0 10px; font-size: 12px; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
  .stack { display: grid; gap: 12px; align-content: start; min-width: 0; }

  .euler-box { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: center; }
  #euler { width: 100%; height: auto; display: block; touch-action: manipulation; cursor: pointer; border-radius: 10px; }
  #euler circle { transition: cx .35s, cy .35s, r .35s; }
  #euler text { font-variant-numeric: tabular-nums; pointer-events: none; }
  .regions { display: grid; gap: 1px; }
  .reg { display: grid; grid-template-columns: 50px 1fr 58px; gap: 8px; align-items: center; padding: 4px 6px; border: 0; border-radius: 6px; background: none; cursor: pointer; text-align: left; }
  .reg:hover { background: var(--raised); }
  .reg.on { background: var(--raised); box-shadow: inset 2px 0 0 var(--accent); }
  .reg .dots { display: flex; gap: 4px; }
  .reg .dots i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--ink-3); opacity: .4; }
  .reg .dots i.in { border-color: transparent; opacity: 1; }
  .reg .track { height: 8px; border-radius: 4px; background: var(--raised); overflow: hidden; }
  .reg .track b { display: block; height: 100%; border-radius: 4px; background: var(--ink-2); transition: width .25s; }
  .reg.on .track b { background: var(--accent); }
  .reg .n { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
  .reg .name { grid-column: 1 / -1; font-size: 12px; color: var(--ink-3); margin-top: -3px; }

  #hist { width: 100%; height: 130px; display: block; touch-action: none; cursor: crosshair; }
  .quality { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .quality th, .quality td { padding: 6px 8px; text-align: right; font-weight: 400; border-top: 1px solid var(--line); }
  .quality thead th { border-top: 0; color: var(--ink-3); font-size: 12px; }
  .quality th:first-child { text-align: left; }
  .quality td.pick { cursor: pointer; }
  .quality td.pick:hover { background: var(--raised); }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }

  .table { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
  .thead, .row { display: grid; grid-template-columns: minmax(0, 1fr) 62px 74px 200px 64px 56px 56px; gap: 10px; align-items: center; padding: 0 14px; }
  .thead { height: 38px; border-bottom: 1px solid var(--line); color: var(--ink-3); font-size: 12px; }
  .thead button { background: none; border: 0; padding: 0; color: inherit; cursor: pointer; text-align: left; font: inherit; }
  .thead button:hover, .thead button.on { color: var(--ink); }
  .thead button.num, .row .num { text-align: right; }
  #rows { height: min(66vh, 680px); overflow: auto; position: relative; }
  #sizer { position: relative; }
  .row { position: absolute; left: 0; right: 0; height: 44px; border-bottom: 1px solid #161616; }
  .row:hover { background: var(--raised); }
  .row .t { min-width: 0; }
  .row .t a { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .t a:hover { color: var(--accent); }
  .row .t small { display: block; color: var(--ink-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
  .row .c { color: var(--ink-2); font-variant-numeric: tabular-nums; font-size: 14px; }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; border-radius: 6px; background: var(--raised); color: var(--ink-2); font-size: 12px; }
  .chip:hover { color: var(--ink); }
  .chip i { width: 8px; height: 8px; border-radius: 50%; }
  .q4 { color: #000; background: var(--accent); border-radius: 4px; padding: 0 5px; font-size: 12px; font-weight: 700; }
  .empty { padding: 40px; text-align: center; color: var(--ink-3); }


  #tip { position: fixed; z-index: 20; pointer-events: none; background: #1d1d1d; border: 1px solid #333; border-radius: 8px; padding: 6px 9px; font-size: 12px; font-variant-numeric: tabular-nums; display: none; max-width: 240px; }
  #tip b { display: block; font-weight: 600; }

  @media (max-width: 1080px) {
    .grid { grid-template-columns: minmax(0, 1fr); }
    .tiles { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 640px) {
    .wrap { padding: 14px 16px 30px; }
    .tiles { grid-template-columns: repeat(2, 1fr); }
    .tile b { font-size: 22px; }
    .euler-box { grid-template-columns: minmax(0, 1fr); }
    .thead, .row { grid-template-columns: minmax(0, 1fr) 46px 96px; }
    .thead > :nth-child(3), .thead > :nth-child(5), .thead > :nth-child(6), .thead > :nth-child(7),
    .row > :nth-child(3), .row > :nth-child(5), .row > :nth-child(6), .row > :nth-child(7) { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><a href="/">Alphy</a> данные</h1>
    <span class="fresh" id="fresh"></span>
    <div class="load" id="load"><span id="loadText"></span><i><b id="loadBar"></b></i></div>
  </header>

  <section class="tiles" id="tiles" aria-label="Итоги"></section>

  <div class="bar">
    <div class="search"><input id="q" type="search" placeholder="Поиск" aria-label="Поиск" autocomplete="off"></div>
    <div class="seg" id="type" role="group" aria-label="Тип">
      <button data-v="" class="on">Все</button><button data-v="film">Фильмы</button><button data-v="series">Сериалы</button>
    </div>
    <button class="btn four" id="four" aria-pressed="false">4K</button>
    <button class="btn" id="reset">Сбросить</button>
    <button class="btn" id="csv">CSV</button>
  </div>

  <div class="grid">
    <section class="panel">
      <div class="head">
        <h2>Пересечение</h2>
        <div class="seg small" id="zoom" role="group" aria-label="Масштаб"><button data-v="1" class="on">Вблизи</button><button data-v="0">Всё</button></div>
      </div>
      <div class="legend"><span><i class="sw" style="background:var(--l)"></i>l</span><span><i class="sw" style="background:var(--f)"></i>f</span><span><i class="sw" style="background:var(--t)"></i>t</span></div>
      <div class="euler-box">
        <svg id="euler" viewBox="0 0 400 340" role="img" aria-label="Пересечение"></svg>
        <div class="regions" id="regions"></div>
      </div>
    </section>
    <div class="stack">
      <section class="panel">
        <h2>По годам</h2>
        <svg id="hist" role="img" aria-label="Тайтлы по годам"></svg>
      </section>
      <section class="panel">
        <h2>Качество</h2>
        <table class="quality" id="quality"></table>
      </section>
    </div>
  </div>

  <section class="table" aria-label="Тайтлы">
    <div class="thead" id="thead">
      <button data-k="name">Название</button>
      <button data-k="year" class="num">Год</button>
      <button data-k="type">Тип</button>
      <button data-k="count">Источники</button>
      <button data-k="height" class="num">Качество</button>
      <button data-k="kp" class="num">КП</button>
      <button data-k="imdb" class="num">IMDb</button>
    </div>
    <div id="rows" tabindex="0"><div id="sizer"></div></div>
  </section>

</div>
<div id="tip"></div>
