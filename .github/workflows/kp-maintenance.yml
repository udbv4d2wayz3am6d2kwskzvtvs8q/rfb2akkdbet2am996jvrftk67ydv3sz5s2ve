name: Remove expired shared metadata objects
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kp-maintenance
  cancel-in-progress: false
jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Clean expired slots through Storage API
        env:
          KP_STORAGE_KEYS: ${{ secrets.KP_STORAGE_KEYS }}
        run: node scripts/clean-kp-cache.mjs
